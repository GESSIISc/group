<div class="bg-white py-4 px-5">
  <div>
    <h2 class="text-center font-poppins font-heading mb-3">Publications</h2>

    <ul class="nav nav-tabs mb-4 font-poppins">
      <li class="nav-item" style="cursor: pointer;">
        <a class="nav-link text-dark"
           [class.active]="activeTab === 'journals'"
           [class.fw-bold]="activeTab === 'journals'"
           (click)="setActiveTab('journals')">
           Journal Publications
        </a>
      </li>
      <li class="nav-item" style="cursor: pointer;">
        <a class="nav-link text-dark"
           [class.active]="activeTab === 'conferences'"
           [class.fw-bold]="activeTab === 'conferences'"
           (click)="setActiveTab('conferences')">
           Conference Proceedings
        </a>
      </li>
    </ul>

    <div *ngIf="activeTab === 'journals'">
      <ul class="text-left mt-4">
        <li *ngFor="let row of pubData.journals" class="my-4">
          <a class="link-dark" [href]="row.link" target="_blank">{{row.title}}</a>
        </li>
      </ul>
      <p *ngIf="pubData.journals.length === 0" class="text-muted mt-3">No journal publications available.</p>
    </div>

    <div *ngIf="activeTab === 'conferences'">
      <ul class="text-left mt-4">
        <li *ngFor="let row of pubData.conferences" class="my-4">
          <a class="link-dark" [href]="row.link" target="_blank">{{row.title}}</a>
        </li>
      </ul>
      <p *ngIf="pubData.conferences.length === 0" class="text-muted mt-3">No conference proceedings available.</p>
    </div>

  </div>
</div>
